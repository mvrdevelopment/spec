  <title
     id="title">Prism translation measured on a wall</title>
  <desc
     id="desc">A 50 cm diameter unaltered beam has a 25 cm radius. A three-facet linear prism projects equal-size beams at center offsets of minus 50 cm, zero and plus 50 cm. Dividing the offsets by 25 cm gives translations of minus 2, zero and plus 2.</desc>
